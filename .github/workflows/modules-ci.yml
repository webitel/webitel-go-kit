name: Modules

# Safety net for the multi-module repo: on every PR and push to main, build
# and test each Go module IN ISOLATION. GOWORK=off guarantees that modules
# resolve their dependencies exactly as an external consumer would via
# proxy.golang.org, not via any local go.work shortcut. If a module's
# pseudo-version pins are stale or its go.mod is incomplete, this job is
# where it fails — before a release tag is cut.

on:
  pull_request:
    paths-ignore:
      - '**/*.md'

  push:
    branches: [main]

    # Skip docs-only pushes.
    paths-ignore:
      - '**/*.md'

  workflow_dispatch:

concurrency:
  group: modules-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    name: Discover
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.list.outputs.modules }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: list
        name: Discover changed modules
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          all=$(find . -name go.mod -not -path './.git/*' -not -path '*/vendor/*' \
            -exec dirname {} \; | sed 's|^\./||' | sort)

          # PRs are checked out as a merge commit whose first parent is the
          # base branch tip, so HEAD^1..HEAD is exactly what the PR changes.
          case "$EVENT_NAME" in
            pull_request) base=$(git rev-parse HEAD^1) ;;
            push)         base=$PUSH_BEFORE ;;
            *)            base= ;;
          esac

          if [[ -z "$base" || "$base" =~ ^0+$ ]] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "Testing every module (event: $EVENT_NAME)"
            selected=$all
          else
            changed=$(git diff --name-only "$base" HEAD)
            if grep -qx '.github/workflows/modules-ci.yml' <<< "$changed"; then
              echo "modules-ci.yml changed, testing every module"
              selected=$all
            else
              # Map each changed file to the deepest module containing it, so
              # infra/ratelimit/mux/x.go selects infra/ratelimit/mux only.
              selected=$(awk '
                NR == FNR { mods[++n] = $0; next }
                {
                  best = ""
                  for (i = 1; i <= n; i++)
                    if (index($0, mods[i] "/") == 1 && length(mods[i]) > length(best))
                      best = mods[i]
                  if (best != "") print best
                }
              ' <(printf '%s\n' "$all") <(printf '%s\n' "$changed") | sort -u)
            fi
          fi

          modules=$(printf '%s\n' "$selected" | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "modules=$modules" >> "$GITHUB_OUTPUT"
          echo "Selected modules:"
          echo "$modules" | jq -r '.[]'

  build:
    needs: discover
    if: needs.discover.outputs.modules != '[]'
    runs-on: ubuntu-latest
    name: Build
    env:
      GOWORK: "off"

    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.discover.outputs.modules) }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: Download dependencies
        working-directory: ${{ matrix.module }}
        run: go mod download

      - name: Check suspicious constructs
        working-directory: ${{ matrix.module }}
        run: go vet ./...

      - name: Build module
        working-directory: ${{ matrix.module }}
        run: go build ./...

      - name: Test module
        working-directory: ${{ matrix.module }}
        run: go test -race ./...
