name: Release status

# Maintains the "Release status" issue — a table of every Go module in the
# repo with:
#   - The latest released version (highest <module>/vX.Y.Z tag)
#   - Number of commits on main since that tag that touched files in the
#     module's directory
#   - A status: "released" / "needs release" / "never released"
#
# Triggers:
#   - push to main            → keep status fresh after every change
#   - push of a release tag   → reflect a just-released module immediately
#   - daily cron              → safety net in case a push is missed
#   - workflow_dispatch       → manual refresh from the Actions tab
#
# The issue is found by its `release-status` label and created if there is
# no open one, the way Renovate keeps its Dependency Dashboard.

on:
  push:
    branches: [main]
    tags:
      - '**/v[0-9]+.[0-9]+.[0-9]+'
      - '**/v[0-9]+.[0-9]+.[0-9]+-*'

  schedule:
    - cron: '0 6 * * *'

  workflow_dispatch:

permissions:
  contents: read
  issues: write

# Serialize runs so that two runs back-to-back can't both find no issue and
# create two.
concurrency:
  group: release-status
  cancel-in-progress: false

jobs:
  status:
    runs-on: ubuntu-latest
    name: Sync
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Generate status table
        run: |
          set -euo pipefail

          : > /tmp/status-table.txt
          {
            echo "| Module | Latest released | Unreleased commits | Status |"
            echo "|---|---|---|---|"
          } >> /tmp/status-table.txt

          while IFS= read -r mod_dir; do
            [[ -z "$mod_dir" ]] && continue
            LATEST=$(git tag --list "${mod_dir}/v[0-9]*.[0-9]*.[0-9]*" \
              | sort -V | tail -n 1 || true)

            if [[ -z "$LATEST" ]]; then
              VERSION="(none)"
              COUNT=$(git rev-list HEAD -- "$mod_dir" 2>/dev/null | wc -l | tr -d ' ')
              STATUS="never released"
            else
              VERSION="${LATEST##*/}"
              COUNT=$(git rev-list "${LATEST}..HEAD" -- "$mod_dir" 2>/dev/null \
                | wc -l | tr -d ' ')
              if [[ "$COUNT" == "0" ]]; then
                STATUS="up to date"
              else
                STATUS="needs release"
              fi
            fi

            echo "| \`${mod_dir}\` | \`${VERSION}\` | ${COUNT} | ${STATUS} |" \
              >> /tmp/status-table.txt
          done < <(find . -name go.mod -not -path './.git/*' -not -path '*/vendor/*' \
                   -exec dirname {} \; | sed 's|^\./||' | sort)

          {
            echo "<!-- AUTOGENERATED by .github/workflows/release-status.yml — do not edit by hand -->"
            echo "This issue is updated automatically. To refresh manually, dispatch"
            echo "the \`release-status\` workflow from the Actions tab."
            echo
            echo "**Status meanings:**"
            echo "- \`up to date\` — every commit touching this module is already in a tag"
            echo "- \`needs release\` — there are commits on main that have not been released yet"
            echo "- \`never released\` — module exists but has no \`<module>/vX.Y.Z\` tag"
            echo
            cat /tmp/status-table.txt
            echo
            echo "**How to release a module:** dispatch the \`release\` workflow from the"
            echo "Actions tab, choose the module, choose a bump kind (\`patch\` / \`minor\` /"
            echo "\`major\`). The workflow computes the next version from the last tag."
          } > /tmp/status-body.md

      - name: Update the issue
        id: issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          NUMBER=$(gh issue list --label release-status --state open \
            --json number --jq '.[0].number // empty')

          if [[ -z "$NUMBER" ]]; then
            gh label create release-status --force \
              --color 0e8a16 --description "Maintained by release-status.yml"
            URL=$(gh issue create --title "Release status" \
              --label release-status --body-file /tmp/status-body.md)
            echo "::notice::created ${URL}"
            echo "result=created ${URL}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Skip the edit when nothing changed, so the issue's history only
          # records real changes.
          CURRENT=$(gh issue view "$NUMBER" --json body --jq .body)
          if [[ "$CURRENT" == "$(cat /tmp/status-body.md)" ]]; then
            echo "::notice::issue #${NUMBER} already current"
            echo "result=unchanged #${NUMBER}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          gh issue edit "$NUMBER" --body-file /tmp/status-body.md
          echo "result=updated #${NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Summary
        if: always()
        run: |
          {
            echo "## release-status"
            echo "Issue: ${{ steps.issue.outputs.result || 'not updated' }}"
            echo
            echo '```'
            cat /tmp/status-table.txt 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
