name: Semconv

# Fails if the registry is invalid, or if the generated Go package was
# hand-edited or not regenerated after a registry change. modules-ci.yml builds
# and tests the module itself.

on:
  pull_request:
    paths:
      - 'infra/otel/semconv/**'
      - '.github/workflows/semconv.yml'

  push:
    branches: [main]
    paths:
      - 'infra/otel/semconv/**'
      - '.github/workflows/semconv.yml'

concurrency:
  group: semconv-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generated:
    name: Registry is valid and the generated package is current
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GOWORK: "off"

    steps:
      - uses: actions/checkout@v6
        with:
          # This job only reads the tree; it never pushes.
          persist-credentials: false

      - uses: actions/setup-go@v6
        with:
          go-version-file: infra/otel/go.mod
          cache-dependency-path: infra/otel/go.sum

      # Keyed on generate.sh, which pins the Weaver version.
      - name: Cache the weaver binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/webitel-weaver
          key: weaver-${{ runner.os }}-${{ hashFiles('infra/otel/semconv/generate.sh') }}

      - name: Check registry and regenerate
        working-directory: infra/otel/semconv
        run: ./generate.sh --check

      - name: Show the drift if there is any
        if: failure()
        run: |
          # -N so a newly generated file shows up; git diff ignores untracked paths.
          git add -A -N -- infra/otel/semconv
          git --no-pager diff -- infra/otel/semconv
